coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# One local worker: 3GB tracked query memory + 2GB headroom < 6GB JVM heap.
query.max-memory=3GB
query.max-memory-per-node=3GB
query.max-total-memory=4GB
memory.heap-headroom-per-node=2GB

# Bound the number of parallel writers and processing pipelines.
task.concurrency=4
task.min-writer-count=1
task.max-writer-count=2
